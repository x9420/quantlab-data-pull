name: min5-pull

on:
  workflow_dispatch:
    inputs:
      batch_start:
        description: "events_5min.csv start index"
        required: true
        type: string
      batch_end:
        description: "events_5min.csv end index"
        required: true
        type: string

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q baostock pandas
      - name: Pull batch
        run: python pull_min5.py ${{ inputs.batch_start }} ${{ inputs.batch_end }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: min5-batch-${{ inputs.batch_start }}-${{ inputs.batch_end }}
          path: out/
          retention-days: 5
          if-no-files-found: warn
