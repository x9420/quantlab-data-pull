name: probe-bs5

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -q baostock pandas
      - name: Probe 5min speed
        run: |
          python probe_bs5.py sh.600519 2020-01-01
          python probe_bs5.py sh.600519 2024-01-01
